<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#050b14"/>
      <stop offset="100%" stop-color="#020509"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="neonMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Cyber Hex Shield -->
  <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" fill="url(#logoBg)" stroke="url(#cyanGlow)" stroke-width="2.5" />
  
  <!-- Inner Ring Accent -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#goldGlow)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.8" />
  <circle cx="50" cy="50" r="26" fill="#0b1322" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Crossed Katana Blades (GPO Anime Aesthetic) -->
  <path d="M 24 24 L 76 76" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 28 20 L 20 28" stroke="url(#goldGlow)" stroke-width="4" stroke-linecap="round" />
  <path d="M 76 24 L 24 76" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 72 20 L 80 28" stroke="url(#goldGlow)" stroke-width="4" stroke-linecap="round" />

  <!-- Center Log Pose Compass Sphere -->
  <circle cx="50" cy="50" r="16" fill="#0f172a" stroke="url(#cyanGlow)" stroke-width="2" filter="url(#glow)" />
  <!-- Compass Needle -->
  <polygon points="50,38 54,50 50,47 46,50" fill="#ef4444" />
  <polygon points="50,62 54,50 50,53 46,50" fill="#38bdf8" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />

  <!-- Corner Tech Accents -->
  <circle cx="50" cy="9" r="1.5" fill="#00f5b8" />
  <circle cx="85" cy="29" r="1.5" fill="#00f5b8" />
  <circle cx="85" cy="71" r="1.5" fill="#00f5b8" />
  <circle cx="50" cy="91" r="1.5" fill="#00f5b8" />
  <circle cx="15" cy="71" r="1.5" fill="#00f5b8" />
  <circle cx="15" cy="29" r="1.5" fill="#00f5b8" />
</svg>
