<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <defs>
    <!-- Metallic Gold Borders -->
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="darkPill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </linearGradient>
    <!-- Glowing Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Pill Frame with Glowing Gold Rim -->
  <rect x="4" y="4" width="232" height="72" rx="24" fill="url(#goldOuter)" stroke="#fef08a" stroke-width="1.5" filter="url(#goldGlow)" />
  <!-- Dark Pill Inset -->
  <rect x="8" y="8" width="224" height="64" rx="20" fill="url(#darkPill)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Golden Crown Icon (Left) -->
  <g transform="translate(24, 18)">
    <!-- Crown 3D Silhouette matching uploaded image -->
    <path d="M 6 36 L 2 12 L 14 22 L 24 6 L 34 22 L 46 12 L 42 36 Z" 
          fill="url(#goldInner)" stroke="#fef08a" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Crown Cutout Arch -->
    <path d="M 12 36 Q 24 24 36 36 Z" fill="#0a0d16" />
  </g>

  <!-- "Pro" Bold 3D Text (Right) -->
  <text x="96" y="52" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="-0.02em"
        fill="url(#goldInner)"
        stroke="#fef08a"
        stroke-width="1"
        style="filter: drop-shadow(0 2px 8px rgba(245, 158, 11, 0.6));">Pro</text>
</svg>
