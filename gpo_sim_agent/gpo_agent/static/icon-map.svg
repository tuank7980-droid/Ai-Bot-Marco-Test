<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="mapFold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="mapFold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="mapFold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="glowMap" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 3-Fold Folded Map Paper Panels -->
  <!-- Left Panel -->
  <polygon points="6,12 18,7 18,37 6,42" fill="url(#mapFold1)" opacity="0.9" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Middle Panel -->
  <polygon points="18,7 30,12 30,42 18,37" fill="url(#mapFold2)" opacity="0.95" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Right Panel -->
  <polygon points="30,12 42,7 42,37 30,42" fill="url(#mapFold3)" opacity="0.9" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Contour Grid Lines on Map -->
  <path d="M 8 20 Q 13 22, 16 18" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" fill="none"/>
  <path d="M 20 25 Q 24 22, 28 27" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" fill="none"/>
  <path d="M 32 18 Q 36 21, 40 17" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" fill="none"/>
  
  <path d="M 9 32 Q 14 30, 16 33" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none"/>
  <path d="M 21 34 Q 25 36, 28 32" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none"/>

  <!-- Dotted Waypoint Path -->
  <path d="M 12 28 Q 20 30, 24 20" stroke="#00f5b8" stroke-width="1.8" stroke-dasharray="2 2" fill="none" filter="url(#glowMap)"/>

  <!-- Map GPS Destination Pin on center fold -->
  <g transform="translate(24, 20)">
    <ellipse cx="0" cy="5" rx="3.5" ry="1.5" fill="rgba(0,0,0,0.5)"/>
    <path d="M 0 5 C -4.5 1, -4.5 -5, 0 -5 C 4.5 -5, 4.5 1, 0 5 Z" fill="url(#pinGrad)" stroke="#ffe4e6" stroke-width="0.8" filter="url(#glowMap)"/>
    <circle cx="0" cy="-2.5" r="1.5" fill="#ffffff"/>
  </g>
</svg>
